<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TvsPlayer</title>
    <base href="/TvsPlayer/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TvsPlayer.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        function copyBlock(canvas, sx, sy, w, h, tx, ty) {
            const ctx = canvas.getContext("2d");

            const imageData = ctx.getImageData(sx, sy, w, h);
            ctx.putImageData(imageData, tx, ty);
        }

        function render32bppBitmapToCanvas(canvas, bytes, w, h, tx, ty) {
            const ctx = canvas.getContext("2d");

            var imageData = new ImageData(
                new Uint8ClampedArray(
                    bytes.buffer,
                    bytes.byteOffset,
                    bytes.byteLength
                ),
                w,
                h
            );
            ctx.putImageData(imageData, tx, ty);
        }

        function renderBlockError(canvas, ex, w, h, tx, ty) {
            const ctx = canvas.getContext("2d");

            ctx.fillStyle = `rgb(0, 0, 0)`;
            ctx.strokeStyle = ``;
            ctx.fillRect(tx, ty, w, h);

            ctx.fillStyle = ``;
            ctx.strokeStyle = `rgb(222, 0, 0)`;
            ctx.strokeRect(tx, ty, w - 1, h - 1);
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx + w - 1, ty + h - 1);
            ctx.moveTo(tx + w - 1, ty);
            ctx.lineTo(tx, ty + h - 1);
            ctx.stroke();
        }
    </script>
    <script src="brotliloader.min.js" type="module"></script>
</body>

</html>
